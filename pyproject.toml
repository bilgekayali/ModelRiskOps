[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelriskops"
version = "0.1.0"
description = "Evidence-backed model risk governance for regulated financial institutions"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bilge Kayalı" }]
license = { text = "Apache-2.0" }
dependencies = []
keywords = ["model-risk", "ai-governance", "banking", "model-validation", "risk-management"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
