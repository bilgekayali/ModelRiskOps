name: Production Reference Boundary

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "src/modelriskops/deployment.py"
      - "src/modelriskops/__init__.py"
      - "tests/test_deployment.py"
      - "schemas/runtime-identity-profile.schema.json"
      - "schemas/https-egress-policy.schema.json"
      - "schemas/isolated-worker-profile.schema.json"
      - "schemas/rollback-plan.schema.json"
      - "schemas/upgrade-plan.schema.json"
      - "schemas/recovery-checkpoint.schema.json"
      - "schemas/deployment-release-manifest.schema.json"
      - "schemas/deployment-eligibility-assessment.schema.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/PRODUCTION_REFERENCE.md"
      - ".github/workflows/production-reference.yml"
  pull_request:
    paths:
      - "src/modelriskops/deployment.py"
      - "src/modelriskops/__init__.py"
      - "tests/test_deployment.py"
      - "schemas/runtime-identity-profile.schema.json"
      - "schemas/https-egress-policy.schema.json"
      - "schemas/isolated-worker-profile.schema.json"
      - "schemas/rollback-plan.schema.json"
      - "schemas/upgrade-plan.schema.json"
      - "schemas/recovery-checkpoint.schema.json"
      - "schemas/deployment-release-manifest.schema.json"
      - "schemas/deployment-eligibility-assessment.schema.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/PRODUCTION_REFERENCE.md"
      - ".github/workflows/production-reference.yml"

permissions:
  contents: read

jobs:
  production-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run v0.8 production-reference tests
        run: python -m pytest tests/test_deployment.py -q
      - name: Verify v0.8 package and schema contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tomllib
          import jsonschema
          import modelriskops

          project = tomllib.load(open('pyproject.toml', 'rb'))
          version = project['project']['version']
          assert tuple(int(part) for part in version.split('.')) >= (0, 8, 0)
          assert modelriskops.__version__ == version

          schemas = (
              'runtime-identity-profile.schema.json',
              'https-egress-policy.schema.json',
              'isolated-worker-profile.schema.json',
              'rollback-plan.schema.json',
              'upgrade-plan.schema.json',
              'recovery-checkpoint.schema.json',
              'deployment-release-manifest.schema.json',
              'deployment-eligibility-assessment.schema.json',
          )
          for filename in schemas:
              payload = json.loads((Path('schemas') / filename).read_text(encoding='utf-8'))
              assert payload['$schema'] == 'https://json-schema.org/draft/2020-12/schema'
              assert payload['additionalProperties'] is False
              jsonschema.Draft202012Validator.check_schema(payload)

          egress = json.loads(Path('schemas/https-egress-policy.schema.json').read_text())['properties']
          assert egress['tls_required']['const'] is True
          assert egress['default_deny']['const'] is True
          assert egress['wildcard_hosts_allowed']['const'] is False
          assert egress['raw_ip_egress_allowed']['const'] is False

          worker = json.loads(Path('schemas/isolated-worker-profile.schema.json').read_text())['properties']
          for field in ('shell_access_enabled', 'subprocess_execution_enabled', 'privileged_container', 'model_invocation_enabled'):
              assert worker[field]['const'] is False
          assert worker['read_only_root_filesystem']['const'] is True
          assert worker['no_new_privileges']['const'] is True

          upgrade = json.loads(Path('schemas/upgrade-plan.schema.json').read_text())['properties']
          assert upgrade['backup_required']['const'] is True

          manifest = json.loads(Path('schemas/deployment-release-manifest.schema.json').read_text())['properties']
          assert manifest['deployment_performed']['const'] is False
          assert manifest['model_invocation_performed']['const'] is False
          assessment = json.loads(Path('schemas/deployment-eligibility-assessment.schema.json').read_text())['properties']
          assert assessment['deployment_performed']['const'] is False
          PY
      - name: Verify offline fail-closed deployment surface
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('src/modelriskops/deployment.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          banned = {'asyncio', 'ftplib', 'http', 'httpx', 'requests', 'socket', 'subprocess', 'telnetlib', 'urllib'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  roots = {alias.name.split('.')[0] for alias in node.names}
              elif isinstance(node, ast.ImportFrom) and node.module:
                  roots = {node.module.split('.')[0]}
              else:
                  continue
              blocked = roots & banned
              if blocked:
                  raise SystemExit(f'{path}: forbidden capability import(s): {sorted(blocked)}')

          required_markers = (
              'v0.8 production egress requires TLS and default deny',
              'v0.8 production egress forbids wildcard hosts and raw IP destinations',
              'v0.8 isolated worker requires read-only root filesystem and no-new-privileges',
              'ModelRiskOps production reference must not invoke models',
              'worker must bind the exact current runtime identity profile',
              'upgrade plan requires the exact registered rollback plan',
              'recovery checkpoint tenant isolation snapshot is stale',
              'v0.8 production release requires a production tenant isolation profile',
              'release requires the exact registered rollback plan',
              'release requires the exact registered upgrade plan',
              'production release cannot bind future readiness evidence',
              'production release manifest is stale',
              'ModelRiskOps release manifests are reference evidence and cannot claim deployment or model invocation',
          )
          for marker in required_markers:
              if marker not in source:
                  raise SystemExit(f'missing v0.8 production invariant: {marker}')

          forbidden_markers = ('requests.', 'httpx.', 'subprocess.', '.connect(', '.deploy(', '.invoke(', '.predict(', '.fit(')
          for marker in forbidden_markers:
              if marker in source:
                  raise SystemExit(f'v0.8 production reference violates offline/non-executing boundary: {marker}')
          PY
