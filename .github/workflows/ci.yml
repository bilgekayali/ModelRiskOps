name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Validate all Draft 2020-12 schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          for path in sorted(Path("schemas").glob("*.schema.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload["$schema"] == "https://json-schema.org/draft/2020-12/schema"
              assert payload["additionalProperties"] is False
              jsonschema.Draft202012Validator.check_schema(payload)
              print(path)
          PY
      - name: Build wheel
        run: python -m build --wheel
      - name: Clean-wheel smoke
        shell: bash
        run: |
          python -m venv /tmp/modelriskops-wheel
          /tmp/modelriskops-wheel/bin/python -m pip install --upgrade pip
          /tmp/modelriskops-wheel/bin/python -m pip install dist/*.whl
          /tmp/modelriskops-wheel/bin/python - <<'PY'
          import modelriskops
          import modelriskops.api as stable_api
          from modelriskops import (
              SigningKeyRegistry,
              ChangeMateriality,
              FoundationModelDependency,
              GenAIMetricKind,
              build_genai_governance_dossier,
              create_genai_model_change_proposal,
              PortfolioRiskRegistry,
              DependencyMateriality,
              PortfolioAssessmentState,
              default_portfolio_risk_policy,
              AssuranceEvidenceRegistry,
              AssuranceFramework,
              EvidenceCoverage,
              TenantIsolationRegistry,
              InstitutionCryptoKeyRegistry,
              CryptoKeyPurpose,
              CryptoAlgorithm,
              EncryptedGovernanceEvidence,
              ProductionDeploymentRegistry,
              DeploymentState,
              HttpsEgressPolicy,
              UpgradePlan,
          )
          from modelriskops.stability import StableReleaseRegistry, StableCompatibilityPolicy
          assert modelriskops.__version__ == "1.0.0"
          assert len(stable_api.__all__) == 62
          assert StableReleaseRegistry is not None
          assert StableCompatibilityPolicy is not None
          assert SigningKeyRegistry is not None
          assert ChangeMateriality.MATERIAL.value == "material"
          assert FoundationModelDependency is not None
          assert GenAIMetricKind.FACTUALITY.value == "factuality"
          assert build_genai_governance_dossier is not None
          assert create_genai_model_change_proposal is not None
          assert PortfolioRiskRegistry is not None
          assert DependencyMateriality.CRITICAL.value == "critical"
          assert PortfolioAssessmentState.INCOMPLETE.value == "incomplete"
          assert default_portfolio_risk_policy("bank-demo").single_provider_limit_bps == 4000
          assert AssuranceEvidenceRegistry is not None
          assert AssuranceFramework.FEDERAL_RESERVE_SR_26_2.value == "federal_reserve_sr_26_2"
          assert EvidenceCoverage.GAP.value == "gap"
          assert TenantIsolationRegistry is not None
          assert InstitutionCryptoKeyRegistry is not None
          assert CryptoKeyPurpose.EVIDENCE_ENCRYPTION.value == "evidence_encryption"
          assert CryptoAlgorithm.AES_256_GCM.value == "AES-256-GCM"
          assert EncryptedGovernanceEvidence is not None
          assert ProductionDeploymentRegistry is not None
          assert DeploymentState.REFERENCE_READY.value == "reference_ready"
          assert HttpsEgressPolicy is not None
          assert UpgradePlan is not None
          print(modelriskops.__version__)
          PY
          /tmp/modelriskops-wheel/bin/modelriskops --help >/dev/null
          /tmp/modelriskops-wheel/bin/modelriskops contract-snapshot | grep -q '"execution_performed":false'
