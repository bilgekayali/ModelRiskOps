name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Build wheel
        run: python -m build --wheel
      - name: Clean-wheel smoke
        shell: bash
        run: |
          python -m venv /tmp/modelriskops-wheel
          /tmp/modelriskops-wheel/bin/python -m pip install --upgrade pip
          /tmp/modelriskops-wheel/bin/python -m pip install dist/*.whl
          /tmp/modelriskops-wheel/bin/python - <<'PY'
          import modelriskops
          assert modelriskops.__version__ == "0.1.0"
          print(modelriskops.__version__)
          PY
          /tmp/modelriskops-wheel/bin/modelriskops --help >/dev/null
