name: Tenant and Cryptographic Hardening Boundary

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "src/modelriskops/hardening.py"
      - "src/modelriskops/__init__.py"
      - "tests/test_hardening*.py"
      - "schemas/postgres-rls-policy.schema.json"
      - "schemas/tenant-isolation-profile.schema.json"
      - "schemas/institution-crypto-key-reference.schema.json"
      - "schemas/crypto-key-lifecycle-state.schema.json"
      - "schemas/configuration-change-request.schema.json"
      - "schemas/signed-configuration-change.schema.json"
      - "schemas/encrypted-governance-evidence.schema.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/TENANT_CRYPTO_HARDENING.md"
      - ".github/workflows/tenant-crypto-hardening.yml"
  pull_request:
    paths:
      - "src/modelriskops/hardening.py"
      - "src/modelriskops/__init__.py"
      - "tests/test_hardening*.py"
      - "schemas/postgres-rls-policy.schema.json"
      - "schemas/tenant-isolation-profile.schema.json"
      - "schemas/institution-crypto-key-reference.schema.json"
      - "schemas/crypto-key-lifecycle-state.schema.json"
      - "schemas/configuration-change-request.schema.json"
      - "schemas/signed-configuration-change.schema.json"
      - "schemas/encrypted-governance-evidence.schema.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/TENANT_CRYPTO_HARDENING.md"
      - ".github/workflows/tenant-crypto-hardening.yml"

permissions:
  contents: read

jobs:
  tenant-crypto-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run v0.7 hardening regression tests
        run: python -m pytest tests/test_hardening*.py -q
      - name: Verify v0.7 package and schema contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tomllib
          import jsonschema

          project = tomllib.load(open('pyproject.toml', 'rb'))
          version = tuple(int(part) for part in project['project']['version'].split('.'))
          assert version >= (0, 7, 0)
          assert project['project']['dependencies'] == ['cryptography>=43,<46', 'jsonschema>=4.23,<5']

          schemas = (
              'postgres-rls-policy.schema.json',
              'tenant-isolation-profile.schema.json',
              'institution-crypto-key-reference.schema.json',
              'crypto-key-lifecycle-state.schema.json',
              'configuration-change-request.schema.json',
              'signed-configuration-change.schema.json',
              'encrypted-governance-evidence.schema.json',
          )
          for filename in schemas:
              payload = json.loads((Path('schemas') / filename).read_text(encoding='utf-8'))
              assert payload['$schema'] == 'https://json-schema.org/draft/2020-12/schema'
              assert payload['additionalProperties'] is False
              jsonschema.Draft202012Validator.check_schema(payload)

          rls = json.loads(Path('schemas/postgres-rls-policy.schema.json').read_text())
          assert rls['properties']['force_row_level_security']['const'] is True
          key = json.loads(Path('schemas/institution-crypto-key-reference.schema.json').read_text())
          assert key['properties']['purpose']['enum'] == ['config_signing', 'evidence_encryption']
          signed = json.loads(Path('schemas/signed-configuration-change.schema.json').read_text())
          assert signed['properties']['algorithm']['const'] == 'Ed25519'
          encrypted = json.loads(Path('schemas/encrypted-governance-evidence.schema.json').read_text())
          assert encrypted['properties']['algorithm']['const'] == 'AES-256-GCM'
          PY
      - name: Verify offline fail-closed hardening surface
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('src/modelriskops/hardening.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          banned = {'asyncio', 'ftplib', 'http', 'httpx', 'requests', 'socket', 'subprocess', 'telnetlib', 'urllib'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  roots = {alias.name.split('.')[0] for alias in node.names}
              elif isinstance(node, ast.ImportFrom) and node.module:
                  roots = {node.module.split('.')[0]}
              else:
                  continue
              blocked = roots & banned
              if blocked:
                  raise SystemExit(f'{path}: forbidden capability import(s): {sorted(blocked)}')

          required_markers = (
              'v0.7 RLS reference policies must force row level security',
              'RLS policy versions must be contiguous',
              'tenant isolation profile versions must be contiguous',
              'symmetric KMS/HSM key material must not be embedded',
              'crypto key versions must be contiguous',
              'rotated key versions must use distinct key_id values',
              'new cryptographic operations require the current active key',
              'no active tenant crypto key exists for requested purpose/time',
              'disabled configuration signing key cannot activate changes',
              'configuration change cannot become current before effective_at',
              'configuration change does not extend the exact tenant change chain',
              'tenant isolation profile is stale',
              'encrypted governance evidence cannot be from the future',
              'evidence encryption key was not active at encryption time',
              'encrypted evidence AAD digest mismatch',
              'encrypted governance evidence authentication failed',
              'encrypted governance evidence key is disabled',
              '"plaintext_digest": plaintext_digest',
              '"encrypted_at": encrypted_at',
          )
          for marker in required_markers:
              if marker not in source:
                  raise SystemExit(f'missing v0.7 hardening invariant: {marker}')

          forbidden_fields = ('private_key:', 'symmetric_key:', 'key_material:', 'secret_key:')
          for marker in forbidden_fields:
              if marker in source:
                  raise SystemExit(f'v0.7 hardening core must not serialize secret key material: {marker}')
          PY
