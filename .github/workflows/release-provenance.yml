name: Release Provenance Gate

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "schemas/**"
      - "compatibility/**"
      - "security-review/**"
      - "scripts/repository_review_digest.py"
      - "docs/**"
      - ".github/workflows/release-provenance.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  reproducible-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install release tooling
        run: python -m pip install --upgrade pip build 'jsonschema>=4.23,<5'
      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build wheel twice
        run: |
          python -m build --wheel --outdir dist-a
          python -m build --wheel --outdir dist-b
      - name: Verify byte-identical wheel
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t A < <(find dist-a -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t B < <(find dist-b -maxdepth 1 -type f -name '*.whl' -print)
          test "${#A[@]}" -eq 1
          test "${#B[@]}" -eq 1
          sha_a=$(sha256sum "${A[0]}" | awk '{print $1}')
          sha_b=$(sha256sum "${B[0]}" | awk '{print $1}')
          test "$sha_a" = "$sha_b"
          printf '%s  %s\n' "$sha_a" "$(basename "${A[0]}")" > dist-a/SHA256SUMS
          cat dist-a/SHA256SUMS
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          PY
          )
          test "$tag_version" = "$package_version"
      - name: Validate v1.0.0 independent security review
        if: github.ref == 'refs/tags/v1.0.0'
        shell: bash
        run: |
          set -euo pipefail
          test -f security-review/v1.0-review.json
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import jsonschema

          review_path = Path('security-review/v1.0-review.json')
          schema_path = Path('schemas/independent-security-review-checklist.schema.json')
          review = json.loads(review_path.read_text(encoding='utf-8'))
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.Draft202012Validator(schema).validate(review)

          required_ids = [
              'approval-exception-and-revalidation',
              'assurance-non-claims',
              'genai-overlay-and-human-oversight',
              'independent-validation-and-findings',
              'inventory-version-and-provenance',
              'monitoring-and-change-control',
              'portfolio-and-third-party-risk',
              'production-reference-egress-and-worker',
              'release-provenance-and-upgrade',
              'risk-policy-determinism',
              'signing-and-key-revocation',
              'tenant-isolation-and-crypto-lifecycle',
          ]
          assert review['release_version'] == '1.0.0'
          assert review['reviewer_independence_confirmed'] is True
          assert [item['item_id'] for item in review['items']] == required_ids
          for item in review['items']:
              assert item['status'] in {'closed', 'risk_accepted'}
              if item['status'] == 'risk_accepted':
                  assert item.get('risk_acceptance_human_id')
                  assert item.get('risk_acceptance_digest')
              else:
                  assert 'risk_acceptance_human_id' not in item
                  assert 'risk_acceptance_digest' not in item

          actual_digest = subprocess.check_output(
              ['python', 'scripts/repository_review_digest.py'], text=True
          ).strip()
          if review['reviewed_repository_digest'] != actual_digest:
              raise SystemExit(
                  'independent security review does not bind the exact tagged repository state: '
                  f"reviewed={review['reviewed_repository_digest']} actual={actual_digest}"
              )
          print(actual_digest)
          PY
      - name: Attest wheel
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: "dist-a/*.whl"
      - name: Attest checksum manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: "dist-a/SHA256SUMS"
