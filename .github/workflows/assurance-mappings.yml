name: Assurance Mappings Boundary

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "src/modelriskops/assurance.py"
      - "src/modelriskops/__init__.py"
      - "tests/test_assurance.py"
      - "schemas/assurance-*.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/ASSURANCE_MAPPINGS.md"
      - ".github/workflows/assurance-mappings.yml"
  pull_request:
    paths:
      - "src/modelriskops/assurance.py"
      - "src/modelriskops/__init__.py"
      - "tests/test_assurance.py"
      - "schemas/assurance-*.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/ASSURANCE_MAPPINGS.md"
      - ".github/workflows/assurance-mappings.yml"

permissions:
  contents: read

jobs:
  assurance-mappings-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run v0.6 assurance regression tests
        run: python -m pytest tests/test_assurance.py -q
      - name: Verify v0.6 package and schema contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tomllib
          import jsonschema
          import modelriskops
          from modelriskops import AssuranceFramework, SUPPORTED_FRAMEWORK_VERSIONS

          project = tomllib.load(open('pyproject.toml', 'rb'))
          version = tuple(int(part) for part in project['project']['version'].split('.'))
          assert version >= (0, 6, 0)
          assert modelriskops.__version__ == '0.6.0'
          assert SUPPORTED_FRAMEWORK_VERSIONS[AssuranceFramework.FEDERAL_RESERVE_SR_26_2] == 'SR 26-2'
          assert SUPPORTED_FRAMEWORK_VERSIONS[AssuranceFramework.NIST_AI_RMF] == '1.0'
          assert SUPPORTED_FRAMEWORK_VERSIONS[AssuranceFramework.NIST_AI_600_1] == '600-1'
          assert SUPPORTED_FRAMEWORK_VERSIONS[AssuranceFramework.ISO_IEC_42001] == '2023'
          assert SUPPORTED_FRAMEWORK_VERSIONS[AssuranceFramework.EU_AI_ACT] == '2024/1689@2026-07-27'

          schemas = sorted(Path('schemas').glob('assurance-*.schema.json'))
          assert len(schemas) == 6
          for path in schemas:
              payload = json.loads(path.read_text(encoding='utf-8'))
              assert payload['$schema'] == 'https://json-schema.org/draft/2020-12/schema'
              assert payload['additionalProperties'] is False
              jsonschema.Draft202012Validator.check_schema(payload)

          package = json.loads(Path('schemas/assurance-evidence-package.schema.json').read_text(encoding='utf-8'))
          properties = package['properties']
          assert properties['certification_claimed']['const'] is False
          assert properties['conformity_claimed']['const'] is False
          assert properties['legal_compliance_determined']['const'] is False
          assert properties['supervisory_acceptance_claimed']['const'] is False
          assert properties['requires_human_review']['const'] is True
          PY
      - name: Verify offline fail-closed assurance surface
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('src/modelriskops/assurance.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          banned = {'asyncio', 'ftplib', 'http', 'requests', 'socket', 'subprocess', 'telnetlib', 'urllib'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  roots = {alias.name.split('.')[0] for alias in node.names}
              elif isinstance(node, ast.ImportFrom) and node.module:
                  roots = {node.module.split('.')[0]}
              else:
                  continue
              blocked = roots & banned
              if blocked:
                  raise SystemExit(f'{path}: forbidden capability import(s): {sorted(blocked)}')

          required_markers = (
              'assurance mapping profile versions must be contiguous',
              'assurance scope versions must be contiguous',
              'assurance scope must bind at most one mapping profile per framework',
              'assurance reference is not required by the exact scope mapping profile',
              'assurance package requires exactly one applicability assertion for every required reference',
              'assurance package requires exactly one crosswalk entry for every required reference',
              'assurance mapping cannot use evidence registered in the future',
              'assurance mapping profile is stale',
              'assurance packages cannot claim certification',
              'assurance packages cannot claim conformity',
              'assurance packages cannot determine legal compliance',
              'assurance packages cannot claim supervisory acceptance',
              'assurance packages always require human review',
          )
          for marker in required_markers:
              if marker not in source:
                  raise SystemExit(f'missing v0.6 assurance invariant: {marker}')

          for marker in ('requests.', 'httpx.', 'subprocess.', '.connect(', '.submit(', '.file(', '.deploy(', '.invoke('):
              if marker in source:
                  raise SystemExit(f'v0.6 assurance core violates offline/reference boundary: {marker}')
          PY
